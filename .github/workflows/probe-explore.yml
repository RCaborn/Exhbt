# TEMPORARY (hotfix-draft-schema only): measures what each schema construct costs. Removed before merge.
name: AI shape probe (explore)

on:
  push:
    branches: [hotfix-draft-schema]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe every request shape, with the measuring variants
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s probe:ai -- --explore
