# Checks every structured answer the app asks the AI for against the real API (decision 0025):
# scripts/probe-ai-shapes.ts sends each schema with a tiny max_tokens and fails if one is refused,
# including the draft with the growth already planned. The tests' stand-in AI can't see this.
# Runs when the code that shapes a request changes, and weekly in case the API's limit moves.
# The probe costs a fraction of a penny a run; the weekly token-room job below about 12 US cents.
name: AI request shapes

on:
  push:
    paths:
      - "lib/ai/**"
      - "lib/exhbt/formats.ts"
      - "lib/exhbt/charts.ts"
      - "scripts/probe-ai-shapes.ts"
      - "package-lock.json"
      - ".github/workflows/ai-shapes.yml"
  pull_request:
    paths:
      - "lib/ai/**"
      - "lib/exhbt/formats.ts"
      - "lib/exhbt/charts.ts"
      - "scripts/probe-ai-shapes.ts"
      - "package-lock.json"
      - ".github/workflows/ai-shapes.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # Pull requests from forks get no secrets, so they skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the API key secret is set
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            # A pull request may run without secrets; anywhere else a missing key must not pass unseen.
            if [ "$EVENT" != "pull_request" ]; then
              echo "::error::The repository secret ANTHROPIC_API_KEY is not set, so the request shapes can't be checked."
              exit 1
            fi
            echo "::notice::ANTHROPIC_API_KEY is not set for this run, so the request shapes were not checked."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.set == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.set == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.key.outputs.set == 'true'
      - name: Probe every request shape against the real API
        if: steps.key.outputs.set == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s probe:ai

  # Weekly (and by hand) only: whether each AI call's answer fits its max_tokens once the model has
  # thought (scripts/measure-ai-room.ts). About 72 calls and 12 US cents a run, so not on every push.
  # Fails if any answer was cut off at max_tokens.
  token-room:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure each AI call's token room
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s measure:ai
