# The weekly and by-hand checks of the AI calls against the real API (decision 0025).
# - probe: every request shape the app sends, and the draft with its planned growth. The same probe
#   runs in CI's check job on every push and pull request, and before every deploy; this weekly
#   run is for the API's limit moving with no change on our side.
# - token-room: whether each call's answer fits its max_tokens once the model has thought
#   (scripts/measure-ai-room.ts). About 72 calls and 12 US cents, so weekly, not on every push.
# Both fail on a missing key: nobody should think they were checked when they weren't.
name: AI request shapes

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe every request shape against the real API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s probe:ai

  token-room:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure each AI call's token room (fails if any answer was cut off)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s measure:ai
