name: CI

on:
  push:
  pull_request:

jobs:
  # Docs, theme, types, lint and the production build.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every AI request shape against the real API (decision 0025), on every push and pull request.
      # A refused shape fails; no key (a fork's pull request) or an unreachable API only warns.
      - name: Check the API accepts every AI request shape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s probe:ai -- --warn-unchecked
      - run: npm run check:docs
      - run: npm run check:theme
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The end-to-end suite, split across three runners (by spec file), each with its own dev server.
  # One runner took close to the old 25-minute limit and then went past it as the suite grew.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
