# Deploy the preview Worker exhbt-preview when phase-2 moves (Phase 2 switched on, preview
# Supabase project). Production is deploy.yml, from main. Needs the same repo secrets:
#   CLOUDFLARE_API_TOKEN        — Workers Scripts Edit (+ Account Settings Read)
#   CLOUDFLARE_ACCOUNT_ID       — Cloudflare account id
# The Worker's own secrets (service role key, Anthropic, Resend, cookie secret) are set once
# in the Cloudflare dashboard on exhbt-preview, never from CI. See LAUNCH.md, Preview site.
name: Deploy preview

on:
  push:
    branches: [phase-2]
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require deploy secrets
        run: |
          missing=
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add GitHub Actions secrets:$missing (account id 113568df45c4acffa5900a3fd6245dbb), then re-run Deploy preview."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy to the preview Worker
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
