# The edit-on-page editor's specs on Safari's engine (WebKit), in the two Playwright projects that are
# listed only when E2E_WEBKIT is set (playwright.config.ts): `safari` (Desktop Safari, the desktop
# project's editor specs) and `iphone` (iPhone 14, the touch project's specs).
# It is a workflow of its own so that CI's check and e2e jobs are not touched and report on their own:
# a red WebKit run never makes the CI run red.
# WebKit on Linux is not Safari on an iPhone (no real finger, on-screen keyboard or toolbars). What it can
# and cannot show is in docs/briefs/edit-on-page/r3-notes-from-earlier-agents.md.
name: WebKit

on:
  push:

permissions:
  contents: read

jobs:
  # One job, in four groups: the desktop specs in three (about 110 tests and 16 minutes each on 24 Nov 2026, when six
  # groups of 55 took 5 to 10 minutes), the phone's in one. In these two projects each test is its own shard unit, so a
  # long spec is split between groups.
  e2e-webkit:
    name: e2e-webkit (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: safari, shard: 1, of: 3 }
          - { project: safari, shard: 2, of: 3 }
          - { project: safari, shard: 3, of: 3 }
          - { project: iphone, shard: 1, of: 1 }
    env:
      E2E_WEBKIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # It stops itself after 38 minutes, inside the job's 45, so a slow run still writes its report and its summary.
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.of }} --reporter=list,github,html,json --global-timeout=2280000
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit.json
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-webkit-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
      # Last, so that the end of the job's log is what this WebKit says it is (once a run) and the account of the run.
      - name: What this WebKit says it is
        if: always() && matrix.project == 'iphone'
        run: node scripts/webkit-probe.mjs
      - name: Summary
        if: always()
        run: node scripts/e2e-summary.mjs test-results/webkit.json
