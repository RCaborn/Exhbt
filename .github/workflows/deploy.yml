# Deploy Worker terna when main moves. Needs repo secrets:
#   CLOUDFLARE_API_TOKEN        — Workers Scripts Edit (+ Account Settings Read)
#   CLOUDFLARE_ACCOUNT_ID       — Cloudflare account id
# Supabase settings are read at runtime: the URL from wrangler.jsonc "vars", the keys from
# Worker secrets in Cloudflare (with Anthropic, cookie and Resend). keep_vars stops a deploy
# from wiping variables set in the Cloudflare dashboard.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require deploy secrets
        run: |
          missing=
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add GitHub Actions secrets:$missing (account id 113568df45c4acffa5900a3fd6245dbb), then re-run Deploy."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
