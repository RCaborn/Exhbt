# TEMPORARY (phase-2-r2-main only): the real-API checks for release 2 with the draft fix. Removed before merge.
name: TEMP release 2 real-API runs

on:
  push:
    branches: [phase-2-r2-main]

permissions:
  contents: read

jobs:
  probe-and-room:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe, with the measuring ladders
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s probe:ai -- --explore
      - name: Token room
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s measure:ai
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every draft fixture, judged
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run -s eval:drafts -- --model-judge
          cat "$(ls -1d evals/exhbt-draft/runs/*/ | sort | tail -n 1)SUMMARY.md"
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The figure eval, 14 reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:figures
